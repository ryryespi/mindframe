<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23ffb45a%22/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host demo — a busy environment with the rest-state menu</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05060a;color:#e8f0ff;font:15px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
#hud{position:fixed;top:10px;left:12px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#hud .title{font-weight:600;letter-spacing:.04em;margin-right:8px}
button{font:inherit;color:#e8f0ff;background:rgba(80,140,255,.18);border:1px solid rgba(120,170,255,.5);border-radius:999px;padding:7px 14px;cursor:pointer}
button.hard{background:#fff;color:#05060a;font-weight:600}
#env{position:fixed;bottom:12px;left:12px;z-index:5;font-size:13px;opacity:.8}
#soft{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:5;background:rgba(255,180,90,.18);border:1px solid rgba(255,180,90,.6);border-radius:12px;padding:8px 14px;display:none}
#ended{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:#d8d4cc;color:#222;text-align:center}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<div id="hud">
  <span class="title">HOST APP · <span id="envName">Neon Arena</span></span>
  <button id="pauseBtn" type="button" title="Open the rest-state menu (P)">Pause · Rest (P)</button>
  <button id="satBtn" type="button">I'm satisfied</button>
  <button id="exitBtn" class="hard" type="button">Exit now</button>
</div>
<div id="soft">You've slowed down. Rest is here (P) — only if you want it.</div>
<div id="env">A stand-in for any high-load environment: a game, a VR world, a trading screen, a long coding session.</div>
<div id="ended"><div><h2>You're back in your room.</h2><p>The host app ended cleanly. Nothing was lost.</p><button id="restart" type="button" style="color:#222;background:#eee">Start again</button></div></div>
<script type="module">
import * as THREE from 'three';
import { RestState } from './rest-state.js';

// ----- A busy host environment (fast, dense, high arousal on purpose) -----
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 200); camera.position.set(0, 0, 14);
const ENVS = { arena: { label: 'Neon Arena', hue: 0.62 }, garden: { label: 'Quiet Garden', hue: 0.3 }, studio: { label: 'Work Studio', hue: 0.08 } };
let env = 'arena'; const cubes = [];
for (let i = 0; i < 160; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(ENVS[env].hue + Math.random() * 0.1, 0.9, 0.55), wireframe: i % 2 === 0 }));
  m.position.set((Math.random() - 0.5) * 30, (Math.random() - 0.5) * 18, (Math.random() - 0.5) * 20); m.userData.v = new THREE.Vector3().randomDirection().multiplyScalar(0.05 + Math.random() * 0.08); scene.add(m); cubes.push(m); }
function setEnv(id) { env = id; document.getElementById('envName').textContent = ENVS[id].label; cubes.forEach((c) => c.material.color.setHSL(ENVS[id].hue + Math.random() * 0.1, 0.9, 0.55)); }
let running = true;
renderer.setAnimationLoop(() => { if (!running) return; const speed = env === 'garden' ? 0.25 : 1;
  cubes.forEach((c) => { c.position.addScaledVector(c.userData.v, speed); c.rotation.x += 0.03 * speed; c.rotation.y += 0.02 * speed; ['x', 'y', 'z'].forEach((k, i) => { const lim = [15, 9, 10][i]; if (Math.abs(c.position[k]) > lim) c.userData.v[k] *= -1; }); });
  renderer.render(scene, camera); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ----- Embedding the rest-state menu -----
const common = {
  host: true, allowReturn: true, returnLabel: 'Return to ' + 'play', closeLabel: 'Close',
  witnessName: localStorage.getItem('rs-witness') || '', fact: localStorage.getItem('rs-fact') || '',
  environments: Object.entries(ENVS).map(([id, e]) => ({ id, label: e.label })),
  onReturn: () => { running = true; },
  onDive: (id) => { setEnv(id); running = true; },
  onExit: ({ reason }) => { console.log('rest-state exit:', reason); },
  onClose: () => { running = false; document.getElementById('ended').style.display = 'flex'; },
};
function pause(opts = {}) { if (RestState.isOpen) return; running = false; hideSoft(); RestState.open(Object.assign({}, common, opts)); }
document.getElementById('pauseBtn').onclick = () => pause();
document.getElementById('satBtn').onclick = () => pause({ start: 'exit', reason: 'satisfied' });
document.getElementById('exitBtn').onclick = () => { pause(); RestState.hardExit(); };
addEventListener('keydown', (e) => { if (e.key === 'p' || e.key === 'P') pause(); });
document.getElementById('restart').onclick = () => { document.getElementById('ended').style.display = 'none'; running = true; };

// Trigger: the user slows (no input for a while) -> one soft cue, never a forced pause, never repeated.
const IDLE = Number(new URLSearchParams(location.search).get('idle')) || 45000; let last = performance.now(), cued = false;
['pointermove', 'pointerdown', 'keydown', 'touchstart', 'wheel'].forEach((ev) => addEventListener(ev, () => (last = performance.now()), { passive: true }));
function hideSoft() { document.getElementById('soft').style.display = 'none'; }
setInterval(() => { if (!cued && running && performance.now() - last > IDLE) { cued = true; const s = document.getElementById('soft'); s.style.display = 'block'; setTimeout(hideSoft, 10000); } }, 1000);

// Trigger: the witness's call (same-device BroadcastChannel) opens the menu with the call shown.
if ('BroadcastChannel' in window) new BroadcastChannel('rest-state-witness').addEventListener('message', (e) => { if (e.data && e.data.type === 'call' && !RestState.isOpen) { pause(); RestState.callBack(); } });
window.__host = { pause, get running() { return running; }, get env() { return env; } };
</script>
</body>
</html>
